name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify bundled web app
        run: |
          test -s app/app/src/main/assets/web/index.html || (echo "Missing Claude web app: upload extracted ZIP contents to app/app/src/main/assets/web/" && exit 1)
          test -s app/app/src/main/assets/web/manifest.webmanifest
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: torah-ve-ivrit-android
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
