name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract web app archive
        run: |
          test -s hebreu-app-installable.zip || (echo "Missing hebreu-app-installable.zip at repository root" && exit 1)
          mkdir -p /tmp/torah-web app/app/src/main/assets/web
          unzip -o hebreu-app-installable.zip -d /tmp/torah-web
          cp /tmp/torah-web/index.html /tmp/torah-web/manifest.webmanifest /tmp/torah-web/sw.js /tmp/torah-web/apple-touch-icon.png /tmp/torah-web/favicon.png /tmp/torah-web/icon-192.png /tmp/torah-web/icon-512.png /tmp/torah-web/icon-maskable-512.png app/app/src/main/assets/web/
          test -s app/app/src/main/assets/web/index.html
          test -s app/app/src/main/assets/web/manifest.webmanifest
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: torah-ve-ivrit-android
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
